[project]
name = "devbox"
version = "0.1.0"
description = "Provision an exe.dev VM running Paseo via pyinfra"
requires-python = ">=3.11"
dependencies = [
    "pyinfra>=3,<4",
    "httpx>=0.27",
    "questionary>=2",
]

[project.scripts]
devbox = "devbox.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["devbox"]
